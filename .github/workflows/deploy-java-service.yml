name: Reusable Deploy Java Service
on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      java_version:
        required: false
        type: string
        default: '25'
      xmx:
        required: false
        type: string
        default: '512m'
      container_port:
        required: false
        type: number
        default: 8080
      service_connect_services:
        required: false
        type: string
        default: ''
    secrets:
      GH_PACKAGES_TOKEN:
        required: true

permissions:
  id-token: write
  contents: read
  packages: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 886350084162.dkr.ecr.ap-southeast-1.amazonaws.com
  ECS_CLUSTER: isums-cluster

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build JAR
  # ─────────────────────────────────────────────
  build-jar:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: 'corretto'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-v2
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew bootJar -x test --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker image to ECR
  # ─────────────────────────────────────────────
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: build-jar
    outputs:
      image: ${{ steps.image-tag.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download JAR artifact
        uses: actions/download-artifact@v5
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag output
        id: image-tag
        run: |
          echo "image=${{ env.ECR_REGISTRY }}/isums/${{ inputs.service_name }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image to ECR (ARM64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            XMX=${{ inputs.xmx }}
          tags: |
            ${{ env.ECR_REGISTRY }}/isums/${{ inputs.service_name }}:latest
            ${{ env.ECR_REGISTRY }}/isums/${{ inputs.service_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Delete untagged ECR images
        run: |
          IMAGE_IDS=$(aws ecr list-images \
            --repository-name isums/${{ inputs.service_name }} \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*]' \
            --output json)

          if [ "$IMAGE_IDS" != "[]" ] && [ -n "$IMAGE_IDS" ]; then
            aws ecr batch-delete-image \
              --repository-name isums/${{ inputs.service_name }} \
              --image-ids "$IMAGE_IDS"
            echo "Cleaned up untagged images"
          else
            echo "No untagged images to clean"
          fi

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to ECS
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-image
    environment: production

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download existing task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ inputs.service_name }} \
            --query taskDefinition \
            --output json > task-def.json
          echo "Task definition downloaded"

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ inputs.service_name }}
          image: ${{ needs.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.service_name }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Update Service Connect configuration
        run: |
          if [ -n "${{ inputs.service_connect_services }}" ]; then
            # Server mode - has gRPC or HTTP ports to expose
            SERVICE_CONNECT_CONFIG=$(cat <<EOF
          {
            "enabled": true,
            "namespace": "isums.local",
            "services": ${{ inputs.service_connect_services }}
          }
          EOF
            )
          else
            # Client only mode
            SERVICE_CONNECT_CONFIG='{"enabled": true, "namespace": "isums.local"}'
          fi

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ inputs.service_name }} \
            --service-connect-configuration "$SERVICE_CONNECT_CONFIG"

          echo "✅ Service Connect updated for ${{ inputs.service_name }}"

      - name: Verify deployment
        run: |
          echo "✅ ${{ inputs.service_name }} deployed successfully at $(date)"
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ inputs.service_name }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount}' \
            --output table

  # ─────────────────────────────────────────────
  # JOB 4: Cleanup old GHA cache
  # ─────────────────────────────────────────────
  cleanup:
    name: Cleanup old GHA cache
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete stale caches older than 3 days
        uses: actions/github-script@v8
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const threeDaysAgo = new Date();
            threeDaysAgo.setDate(threeDaysAgo.getDate() - 3);

            for (const cache of caches.data.actions_caches) {
              const lastAccessed = new Date(cache.last_accessed_at);
              if (lastAccessed < threeDaysAgo) {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                console.log(`Deleted cache: ${cache.key} (last accessed: ${cache.last_accessed_at})`);
              }
            }
