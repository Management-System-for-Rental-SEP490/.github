name: Reusable Deploy Python Service

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: '3.12'
      ecr_repository:
        required: false
        type: string
        default: ''
      ecs_cluster:
        required: false
        type: string
        default: isums-cluster
      task_definition:
        required: false
        type: string
        default: ''
      container_name:
        required: false
        type: string
        default: ''
      image_runner:
        required: false
        type: string
        default: ubuntu-24.04-arm
      wait_for_service_stability:
        required: false
        type: boolean
        default: true
      ecr_keep_tagged:
        required: false
        type: number
        default: 8
      run_lint:
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 886350084162.dkr.ecr.ap-southeast-1.amazonaws.com

concurrency:
  group: deploy-${{ inputs.service_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install lint tools
        run: python -m pip install --upgrade pip flake8

      - name: Run critical flake8 checks
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run style flake8 report
        run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Validate Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-image:
    name: Build ARM64 Image
    runs-on: ${{ inputs.image_runner }}
    needs: lint
    if: ${{ always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
      repository: ${{ steps.meta.outputs.repository }}
      task-definition: ${{ steps.meta.outputs.task_definition }}
      container-name: ${{ steps.meta.outputs.container_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve deployment metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ inputs.ecr_repository }}"
          task_def="${{ inputs.task_definition }}"
          container="${{ inputs.container_name }}"

          if [ -z "$repo" ]; then repo="isums/${{ inputs.service_name }}"; fi
          if [ -z "$task_def" ]; then task_def="${{ inputs.service_name }}"; fi
          if [ -z "$container" ]; then container="${{ inputs.service_name }}"; fi

          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "task_definition=$task_def" >> "$GITHUB_OUTPUT"
          echo "container_name=$container" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.ECR_REGISTRY }}/$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ steps.meta.outputs.repository }}:latest
            ${{ env.ECR_REGISTRY }}/${{ steps.meta.outputs.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service_name }}

      - name: Prune old tagged ECR images
        if: ${{ inputs.ecr_keep_tagged > 0 }}
        shell: bash
        run: |
          set -euo pipefail
          repo='${{ steps.meta.outputs.repository }}'
          keep='${{ inputs.ecr_keep_tagged }}'

          aws ecr describe-images \
            --repository-name "$repo" \
            --filter tagStatus=TAGGED \
            --query 'sort_by(imageDetails,&imagePushedAt)[].{digest:imageDigest,tags:imageTags,pushed:imagePushedAt}' \
            --output json > images.json

          jq -r --argjson keep "$keep" '
            [ .[] | select((.tags // []) | index("latest") | not) ]
            | if length > $keep then .[0:(length - $keep)] else [] end
            | .[].digest
          ' images.json > delete-digests.txt

          if [ -s delete-digests.txt ]; then
            jq -R '{imageDigest: .}' delete-digests.txt | jq -s '.' > delete-images.json
            aws ecr batch-delete-image --repository-name "$repo" --image-ids file://delete-images.json
          else
            echo "No old tagged images to prune"
          fi

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-image
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download task definition
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition '${{ needs.build-image.outputs.task-definition }}' \
            --query taskDefinition \
            --output json > task-def.raw.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt
          )' task-def.raw.json > task-def.json

      - name: Render task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ needs.build-image.outputs.container-name }}
          image: ${{ needs.build-image.outputs.image }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ inputs.service_name }}
          cluster: ${{ inputs.ecs_cluster }}
          wait-for-service-stability: ${{ inputs.wait_for_service_stability }}

      - name: Verify ECS service
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster '${{ inputs.ecs_cluster }}' \
            --services '${{ inputs.service_name }}' \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount,TaskDefinition:taskDefinition}' \
            --output table
